<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考卷成績辨識系統</title>

  <!-- 瀏覽器標籤頁圖示 (Favicon) -->
  <link rel="icon" type="image/png" href="./icon.png">
  
  <!-- Apple iOS 主畫面縮圖 -->
  <link rel="apple-touch-icon" href="./icon.png">
  
  <!-- Android 主畫面縮圖 (通常與 apple-touch-icon 共用，或透過 manifest.json 設定) -->
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    /* 讓 iframe 填滿整個畫面，隱藏邊框與捲動軸 */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- 將 src 替換為你的 GAS Web App 網址 -->
  <iframe src="https://script.google.com/macros/s/AKfycby4NjRb0sTRpkIjWtx-qcmEvyDLLLgh_7G1NZvdIij-8FUo6MPzUdTzA9N-UMcDaTIt/exec"></iframe>

</body>
</html>
